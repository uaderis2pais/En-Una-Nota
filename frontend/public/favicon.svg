<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="noteGrad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Square with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" opacity="0.9"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#34d399" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Music Note Graphic -->
  <g filter="url(#shadow)">
    <!-- Beamed Musical Note -->
    <path d="M 336 120 L 220 156 V 324.5 C 208.5 316.5 192.5 312 174 312 C 134.2 312 102 334.4 102 362 C 102 389.6 134.2 412 174 412 C 213.8 412 246 389.6 246 362 V 224 L 336 196 V 284.5 C 324.5 276.5 308.5 272 290 272 C 250.2 272 218 294.4 218 322 C 218 349.6 250.2 372 290 372 C 329.8 372 362 349.6 362 322 V 146 C 362 131.6 350.4 120 336 120 Z" fill="url(#noteGrad)"/>
    
    <!-- Soundwave Sparkles -->
    <circle cx="410" cy="130" r="16" fill="#fef08a" />
    <circle cx="390" cy="200" r="10" fill="#a7f3d0" />
    <circle cx="110" cy="220" r="12" fill="#34d399" />
  </g>
</svg>
